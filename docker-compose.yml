services:
  postgres:
    image: postgres:16-alpine
    container_name: autoweightlog-postgres
    environment:
      POSTGRES_USER: autoweightlog
      POSTGRES_PASSWORD: autoweightlog_dev
      POSTGRES_DB: autoweightlog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoweightlog -d autoweightlog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
